version: 2
updates:
  # Frontend dependencies
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Mises à jour sécurisées uniquement
    groups:
      security-updates:
        patterns:
          - "*"
        update-types:
          - "security"

  # Backend dependencies
  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Mises à jour sécurisées uniquement
    groups:
      security-updates:
        patterns:
          - "*"
        update-types:
          - "security"

